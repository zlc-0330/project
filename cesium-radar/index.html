            // let pitch = Cesium.Math.toRadians(0)
            // let roll = Cesium.Math.toRadians(0)

            planeEntity.orientation=result;
        }

    function createModel() {
        const property = computeFly(); // 计算飞行轨迹

        // viewFrom.x = -60;

            model: {

                minimumPixelSize: 60, // 最小像素大小
                maximumScale: 5000, // 最大缩放比例
                imageBasedLightingFactor: new Cesium.Cartesian2(40, 10),
                scale: 50,
            },
        });
        viewer.clock.shouldAnimate = true; // 是否应该进行动画
    }

    function computeFly() {
        const property = new Cesium.SampledPositionProperty(); // 定位属性
        const height=20000;
        const source = [
            [120.819644806,25.451916258, height],
            [120.391178009,24.880627196, height],
            [119.786929962,24.188488524, height],
            [119.407901642,23.573254149, height],
            [119.407901642,22.914074462, height],
            [119.847354767,22.232922118, height],
            [120.770206329,22.276867430, height],
            [122.330264923,25.484875243, height],
            [121.596927520,25.597485106, height],
            [120.819644806,25.451916258, height],
        ];
        const times = [];
        source.forEach((line, index) => {
            times.push(index * 10);
        });
        // 取样位置 相当于一个集合
        for (let i = 0; i < source.length; i++) {
            let time = Cesium.JulianDate.addSeconds(
                startTime,
                times[i],
                new Cesium.JulianDate()
            );
            let position = Cesium.Cartesian3.fromDegrees(
                source[i][0],
                source[i][1],
                source[i][2],
            );
            // 添加位置，和时间对应
            property.addSample(time, position);
        }
        //////////////////////////////////////////////////////////////
        return property;
    }

            // radarGroup.AddRadarGroup(radarParam1);//组网一个雷达对象
            radarGroup.AddRadarArrGroup([radarParam2,radarParam1]);

        }
        else {
            // radarGroup.DeleteRadarGroup();//删除组网对象
            radarGroup.RemoveRadarGroup(radarParam1);
            radarGroup.RemoveRadarGroup(radarParam2);
            // radarGroup.RemoveRadarArrGroup([radarParam1,radarParam2]);
        }

    })
    aaFolder3.addColor({ 组网颜色: '#ffffff' }, '组网颜色').onChange(value => {
        radarGroup.SetGroupColor(value);
    });
