<!DOCTYPE html>
<html>

<head>
  <script src="../config.js"></script>
  <meta charset="UTF-8" />
  <!-- 1. 引入 Cesium 样式（CDN） -->
  <link rel="stylesheet" href="https://registry.npmmirror.com/cesium/1.98/files/Build/Cesium/Widgets/widgets.css">
  <!-- 2. 引入 Cesium 核心 JS（CDN） -->
  <script src="https://registry.npmmirror.com/cesium/1.98/files/Build/Cesium/Cesium.js"></script>
  <script src="https://registry.npmmirror.com/axios/dist/axios.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>

  <script type="module">
    const viewer = new Cesium.Viewer('map', {
      imageryProvider: false,
      baseLayerPicker: false,
    });

    var xyz = new Cesium.UrlTemplateImageryProvider({
      "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
    })
    viewer.imageryLayers.addImageryProvider(xyz)
    viewer.scene.debugShowFramesPerSecond = true;

    // 加载底图
    var xyz = new Cesium.UrlTemplateImageryProvider({
      "url": config.libs + 'ocean/SeaSpeed_202307271200/{z}/{x}/{y}.png'
    })
    viewer.imageryLayers.addImageryProvider(xyz)


    // 加载洋流
    import(config.libs + 'ocean/layers/LayerOceanCurrent/LayerOceanCurrent.js').then((module) => {
      const LayerOceanCurrent = module.default;
      console.log(LayerOceanCurrent)

      let seaWave = new LayerOceanCurrent({});
      axios({
        method: "get",
        url: config.libs + 'ocean/SeawaveDirection_202307251200_0200.json',
      }).then((res) => {
        seaWave.load(res.data.data);
        seaWave.addToMap(viewer);
      });
    });

    // seaWave.clean();

  </script>

</body>

</html>
