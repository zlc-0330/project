<!DOCTYPE html>
<html>

<head>
  <script src="../config.js"></script>
  <meta charset="UTF-8" />
  <!-- 1. 引入 Cesium 样式（CDN） -->
  <link rel="stylesheet" href="https://registry.npmmirror.com/cesium/1.98/files/Build/Cesium/Widgets/widgets.css">
  <!-- 2. 引入 Cesium 核心 JS（CDN） -->
  <script src="https://registry.npmmirror.com/cesium/1.98/files/Build/Cesium/Cesium.js"></script>
  <script>document.write('<script src="' + config.libs + 'dat-gui/0.7.6/dat.gui.min.js"><\/script>');</script>
  <!-- <script src="//latlng.js"></script> -->
</head>

<body style="
      margin: 0;
      overflow: hidden;
      background: #fff;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
    ">
  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>

  <script type="text/javascript">
    const viewer = new Cesium.Viewer('map', {
      imageryProvider: false,
      baseLayerPicker: false,
    });

    var xyz = new Cesium.UrlTemplateImageryProvider({
      "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
    })
    viewer.imageryLayers.addImageryProvider(xyz)
    viewer.scene.debugShowFramesPerSecond = true;
    viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK);
    viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

    // http://cesium.xin/cesium/cn/Documentation1.95/CylinderGraphics.html#.ConstructorOptions

    const obj = {
      x: 120,
      y: 30,
      z: 1000,
      heading: 0,
      pitch: 0,
      roll: 0,
    };
    let cylinderEntity;

    addEntity();

    function addEntity () {

      var position = Cesium.Cartesian3.fromDegrees(obj.x, obj.y, obj.z);
      var heading = Cesium.Math.toRadians(obj.heading);
      var pitch = Cesium.Math.toRadians(obj.pitch);
      var roll = Cesium.Math.toRadians(obj.roll);

      var hpr = new Cesium.HeadingPitchRoll(heading, pitch, roll);
      var orientation = Cesium.Transforms.headingPitchRollQuaternion(
        position,
        hpr
      );
      cylinderEntity = new Cesium.Entity({
        position: position,
        orientation: orientation,
        model: {
          // uri: 'http://localhost/Cesium-Examples/examples/threeEx/zhanji.glb',、
          uri: `${config.data}model/zhanji.glb`,
          scale: 5,
          customShader: new Cesium.CustomShader({
            // 可以在这里定义默认的着色器逻辑
          })

        }
      })
      viewer.entities.add(cylinderEntity);

      viewer.flyTo(viewer.entities)
    }




    let handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (click) {
      let pickedObject = viewer.scene.pick(click.position);
      alert('点击了' + pickedObject.detail.node._name)
      console.log(pickedObject.detail.node)
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);




  </script>
</body>

</html>
