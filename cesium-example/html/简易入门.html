<!DOCTYPE html>
<html>

<head>
  <script src="../config.js"></script>
<meta charset="UTF-8" />
  <!-- 1. 引入 Cesium 样式（CDN） -->
  <link rel="stylesheet" href="https://registry.npmmirror.com/cesium/1.98/files/Build/Cesium/Widgets/widgets.css">
  <!-- 2. 引入 Cesium 核心 JS（CDN） -->
  <script src="https://registry.npmmirror.com/cesium/1.98/files/Build/Cesium/Cesium.js"></script>
</head>

<body style="
      margin: 0;
      overflow: hidden;
      background: #fff;
      width: 100%;
      height: 100%;
      position: absolute; top: 0;
    ">
  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>

  <script type="text/javascript">
    const viewer = new Cesium.Viewer('map', {
      imageryProvider: false,
      baseLayerPicker: false,
    });

    var xyz = new Cesium.UrlTemplateImageryProvider({
      "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
    })
    viewer.imageryLayers.addImageryProvider(xyz)
    viewer.scene.debugShowFramesPerSecond = true;
    viewer.scene.globe.depthTestAgainstTerrain = true;

    // 定义自定义材质
    var material = new Cesium.Material({
      fabric: {
        type: 'Custom',
        uniforms: {
          color: new Cesium.Color(1.0, 0.0, 0.0, 0.7) // 红色
        },
        source: `
                    uniform vec4 color;
                    czm_material czm_getMaterial(czm_materialInput materialInput) {
                        czm_material material = czm_getDefaultMaterial(materialInput);
                        material.diffuse = color.rgb;
                        material.alpha = color.a;
                        return material;
                    }
                `
      },
      translucent: function (feature) {
        return true;
      }
    });

    viewer.scene.globe.material = material;

  </script>
</body>

</html>
