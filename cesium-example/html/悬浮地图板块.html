<title>三维板状地图 · 倾斜无漏光版</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#app{width:100%;height:100%;overflow:hidden;background:#050d1a}
.loading-overlay{position:fixed;top:20px;right:20px;background:rgba(5,13,26,.95);backdrop-filter:blur(10px);display:flex;align-items:center;z-index:1000;padding:10px 20px;border-radius:8px;border:1px solid rgba(0,200,200,.3)}
.loading-spinner{width:24px;height:24px;border:2px solid rgba(0,200,200,.2);border-top-color:#00cccc;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-left:12px;color:#b0e0e0;font-size:13px;font-weight:600;letter-spacing:.5px}
.cesium-viewer-bottom,.cesium-viewer-toolbar{display:none!important}
#tip{position:absolute;left:12px;bottom:12px;color:#607878;font:11px/1.6 sans-serif;z-index:9;background:rgba(5,13,26,.8);padding:5px 10px;border-radius:5px;border:1px solid rgba(0,200,200,.15)}

<body>
<div id="app"></div>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">渲染中...</div>
</div>
<div id="tip">倾斜无漏光 · 地面遮罩法 · 左后海拔网+底图经纬网 · 紧凑包裹</div>

<script>
const BOUNDS = {
  west:  121.195146160708347,
  east:  121.243150615738969,
  south:  25.081291892003922,
  north:  25.167564951606469
};

const BOARD_BOTTOM = -300; 
const SURFACE_OFFSET = -0.5;

// const EXPAND_RATIO = 0; // 0.005 扩展范围百分比
const EXPAND_RATIO = 0.03; // 0.005 扩展范围百分比
const lonSpan = BOUNDS.east - BOUNDS.west;
const latSpan = BOUNDS.north - BOUNDS.south;
const GRID_WEST  = BOUNDS.west  - lonSpan * EXPAND_RATIO;
const GRID_EAST  = BOUNDS.east  + lonSpan * EXPAND_RATIO;
const GRID_SOUTH = BOUNDS.south - latSpan * EXPAND_RATIO;
const GRID_NORTH = BOUNDS.north + latSpan * EXPAND_RATIO;

const GAP = 100; // 网格间距
const GRID_BOTTOM = BOARD_BOTTOM - GAP;
const FLOOR_GRID_HEIGHT = BOARD_BOTTOM - GAP;

const GRID_TOP    = 3000; // 海拔网上限
const ALT_STEPS   = 6;
const ALT_STEP    = (GRID_TOP - GRID_BOTTOM) / ALT_STEPS;

const COLOR_LINE = Cesium.Color.fromCssColorString('#00bbcc');
const COLOR_LINE_DIM = Cesium.Color.fromCssColorString('rgba(0, 150, 160, 0.25)');
const COLOR_BG = Cesium.Color.fromCssColorString('#050d1a');
const COLOR_TEXT = Cesium.Color.fromCssColorString('#a0d0d0');

Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlYWE1OWUxNy1mMWZiLTQzYjYtYTQ0OS1kMWFjYmFkNjc5YzciLCJpZCI6NDQzODUsImlhdCI6MTYxMDMxNDUyNn0.XcKpgANiY19MC4bdFUXMVEBToBmqS8kuYpUlxJHqx6k';

const loadingOverlay = document.getElementById('loadingOverlay');
function setLoading(v){ loadingOverlay.style.display = v ? 'flex' : 'none'; }

function addArcGISLayer(viewer){
  try{
    return viewer.imageryLayers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider({
        url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        maximumLevel:18,minimumLevel:0,credit:'Esri World Imagery'
      })
    );
  }catch(e){ console.warn('UrlTemplate失败',e); }
  try{
    return viewer.imageryLayers.addImageryProvider(
      new Cesium.ArcGisMapServerImageryProvider({
        url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      })
    );
  }catch(e2){ console.error('❌ ArcGIS全部失败',e2); return null; }
}

function createHighResTexture(width, height, drawFn) {
  const c = document.createElement('canvas');
  c.width = width; c.height = height;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  drawFn(g, width, height);
  return c.toDataURL();
}

function createSidePanelTexture(){
  return createHighResTexture(512, 1024, (g, w, h) => {
    const bgGrad = g.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, 'rgba(10, 30, 50, 0.85)');
    bgGrad.addColorStop(1, 'rgba(5, 15, 30, 0.95)');
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, w, h);
    
    g.strokeStyle = '#00bbcc';
    g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, 2); g.lineTo(w, 2); g.stroke();
  });
}

function createAltitudeWallTexture(){
  return createHighResTexture(1024, 1024, (g, w, h) => {
    g.fillStyle = 'rgba(8, 20, 35, 0.9)';
    g.fillRect(0, 0, w, h);
    
    g.font = 'bold 28px "Microsoft YaHei", sans-serif';
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    
    for(let i=0; i<=ALT_STEPS; i++){
      const y = (i / ALT_STEPS) * h;
      const alt = Math.round(GRID_TOP - (GRID_TOP - GRID_BOTTOM) * (i / ALT_STEPS));
      
      g.strokeStyle = 'rgba(0, 180, 190, 0.3)';
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
      
      g.lineWidth = 2;
      g.strokeStyle = 'rgba(5, 15, 30, 0.8)';
      g.strokeText(alt.toLocaleString(), w - 20, y);
      g.fillStyle = '#a0d0d0';
      g.fillText(alt.toLocaleString(), w - 20, y);
    }
  });
}

function addGroundMask(viewer) {
  // ★ 关键修改：扩大遮罩范围至10度，确保倾斜视角不漏光
  const maskExpand = 10.0; 
  
  const outerRing = [
    Cesium.Cartesian3.fromDegrees(BOUNDS.west - maskExpand, BOUNDS.south - maskExpand),
    Cesium.Cartesian3.fromDegrees(BOUNDS.east + maskExpand, BOUNDS.south - maskExpand),
    Cesium.Cartesian3.fromDegrees(BOUNDS.east + maskExpand, BOUNDS.north + maskExpand),
    Cesium.Cartesian3.fromDegrees(BOUNDS.west - maskExpand, BOUNDS.north + maskExpand)
  ];
  
  // 内环保持与板子边界一致
  const innerRing = [
    Cesium.Cartesian3.fromDegrees(BOUNDS.west, BOUNDS.south),
    Cesium.Cartesian3.fromDegrees(BOUNDS.west, BOUNDS.north),
    Cesium.Cartesian3.fromDegrees(BOUNDS.east, BOUNDS.north),
    Cesium.Cartesian3.fromDegrees(BOUNDS.east, BOUNDS.south)
  ];

  viewer.entities.add({
    polygon: {
      hierarchy: new Cesium.PolygonHierarchy(outerRing, [new Cesium.PolygonHierarchy(innerRing)]),
      material: new Cesium.ColorMaterialProperty(COLOR_BG.withAlpha(1.0)), // ★ 确保Alpha为1
      classificationType: Cesium.ClassificationType.BOTH,
      outline: false,
      // ★ 关键：设置极高的z-index顺序，确保遮罩渲染在最上层
      zIndex: 999 
    }
  });
}
function addBoardEffects(positions){
  const p0 = positions[0];
  const p1 = positions[1];
  const p2 = positions[2];
  const p3 = positions[3];

  function addSingleWall(wallPositions, textureImage) {
    const len = wallPositions.length;
    viewer.entities.add({
      wall: {
        positions: wallPositions,
        minimumHeights: new Array(len).fill(BOARD_BOTTOM),
        maximumHeights: new Array(len).fill(SURFACE_OFFSET),
        material: new Cesium.ImageMaterialProperty({
          image: textureImage,
          color: Cesium.Color.WHITE,
          transparent: true
        }),
        granularity: Math.PI / 180.0 / 60,
        outline: false
      }
    });
  }

  // addSingleWall([p1, p2], createAltitudeWallTexture());
  // addSingleWall([p2, p3], createAltitudeWallTexture());
  // addSingleWall([p0, p1], createSidePanelTexture());
  // addSingleWall([p3, p0], createSidePanelTexture());

  viewer.entities.add({
    wall: {
      positions: [p1, p2, p3, p0],
      minimumHeights: new Array(4).fill(BOARD_BOTTOM),
      maximumHeights: new Array(4).fill(SURFACE_OFFSET),
      material: new Cesium.ColorMaterialProperty(COLOR_BG.withAlpha(0.9)),
      granularity: Math.PI / 180.0 / 60,
      outline: false
    }
  });

  viewer.entities.add({
    polygon: {
      hierarchy: new Cesium.PolygonHierarchy(positions),
      height: 0,
      // height: BOARD_BOTTOM,
      material: COLOR_BG,
       outline: false,
    extrudedHeight: BOARD_BOTTOM , // ★ 向下拉伸100米，形成一个实心块而非薄片
    // extrudedHeight: BOARD_BOTTOM - 100, // ★ 向下拉伸100米，形成一个实心块而非薄片
    perPositionHeight: false
    }
  });

  const solidLineMat = new Cesium.ColorMaterialProperty(COLOR_LINE);
  const cartographics = positions.map(p => Cesium.Cartographic.fromCartesian(p));
  const bottomPositions = cartographics.map(c => 
    Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, BOARD_BOTTOM)
  );
  
  viewer.entities.add({
    polyline: {
      positions: [...bottomPositions, bottomPositions[0]],
      width: 2,
      material: solidLineMat,
      clampToGround: false
    }
  });

  for(let i = 0; i < 4; i++){
    const topPos = positions[i];
    const botPos = bottomPositions[i];
    viewer.entities.add({
      polyline: {
        positions: [topPos, botPos],
        width: 2,
        material: solidLineMat,
        clampToGround: false
      }
    });
  }
}

function createGridAndLabels(){
  const gridMat = new Cesium.ColorMaterialProperty(COLOR_LINE_DIM);
  const axisMat = new Cesium.ColorMaterialProperty(COLOR_LINE);

  const lonSteps=6, latSteps=6;
  const lonStep=(GRID_EAST-GRID_WEST)/lonSteps;
  const latStep=(GRID_NORTH-GRID_SOUTH)/latSteps;

  // 海拔高度网格：仅左面(西) + 后面(北)
  for(let j=0; j<=latSteps; j++){
    const lat=GRID_SOUTH+j*latStep;
    viewer.entities.add({ polyline: {
      positions: [Cesium.Cartesian3.fromDegrees(GRID_WEST,lat,GRID_BOTTOM), Cesium.Cartesian3.fromDegrees(GRID_WEST,lat,GRID_TOP)],
      width: 1,
      material: gridMat,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    }});
  }
  
  for(let i=0; i<=lonSteps; i++){
    const lon=GRID_WEST+i*lonStep;
    viewer.entities.add({ polyline: {
      positions: [Cesium.Cartesian3.fromDegrees(lon,GRID_NORTH,GRID_BOTTOM), Cesium.Cartesian3.fromDegrees(lon,GRID_NORTH,GRID_TOP)],
      width: 1,
      material: gridMat,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    }});
  }

  for(let k=0; k<=ALT_STEPS; k++){
    const alt=GRID_BOTTOM+k*ALT_STEP;
    viewer.entities.add({ polyline: {
      positions: [Cesium.Cartesian3.fromDegrees(GRID_WEST,GRID_SOUTH,alt), Cesium.Cartesian3.fromDegrees(GRID_WEST,GRID_NORTH,alt)],
      width: 1,
      material: gridMat,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    }});
    viewer.entities.add({ polyline: {
      positions: [Cesium.Cartesian3.fromDegrees(GRID_WEST,GRID_NORTH,alt), Cesium.Cartesian3.fromDegrees(GRID_EAST,GRID_NORTH,alt)],
      width: 1,
      material: gridMat,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    }});
  }

  viewer.entities.add({ polyline: {
    positions: [Cesium.Cartesian3.fromDegrees(GRID_WEST,GRID_SOUTH,GRID_BOTTOM), Cesium.Cartesian3.fromDegrees(GRID_WEST,GRID_SOUTH,GRID_TOP)],
    width: 2,
    material: axisMat,
    disableDepthTestDistance: Number.POSITIVE_INFINITY
  }});

  // 底图经纬网格
  const floorMat = new Cesium.ColorMaterialProperty(Cesium.Color.fromCssColorString('rgba(0, 180, 190, 0.18)'));
  
  for(let i=0; i<=lonSteps; i++){
    const lon=GRID_WEST+i*lonStep;
    viewer.entities.add({ polyline: {
      positions: [Cesium.Cartesian3.fromDegrees(lon,GRID_SOUTH,FLOOR_GRID_HEIGHT), Cesium.Cartesian3.fromDegrees(lon,GRID_NORTH,FLOOR_GRID_HEIGHT)],
      width: 1,
      material: floorMat,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    }});
  }
  
  for(let j=0; j<=latSteps; j++){
    const lat=GRID_SOUTH+j*latStep;
    viewer.entities.add({ polyline: {
      positions: [Cesium.Cartesian3.fromDegrees(GRID_WEST,lat,FLOOR_GRID_HEIGHT), Cesium.Cartesian3.fromDegrees(GRID_EAST,lat,FLOOR_GRID_HEIGHT)],
      width: 1,
      material: floorMat,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    }});
  }

  // 标签
  const labelStyle = {
    font: 'bold 12px "Microsoft YaHei", sans-serif',
    fillColor: COLOR_TEXT,
    outlineColor: Cesium.Color.fromCssColorString('rgba(5,13,26,0.9)'),
    outlineWidth: 3,
    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
    // disableDepthTestDistance: Number.POSITIVE_INFINITY,
    scale: 0.85,
    translucencyByDistance: new Cesium.NearFarScalar(1000, 1.0, 120000, 0.2)
  };

  for(let k=0; k<=ALT_STEPS; k++){
    const alt=Math.round(GRID_BOTTOM+k*ALT_STEP);
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(GRID_WEST-0.002, GRID_SOUTH, alt),
      label: {
        ...labelStyle,
        text: alt.toLocaleString()+'米',
        horizontalOrigin: Cesium.HorizontalOrigin.RIGHT,
        verticalOrigin: Cesium.VerticalOrigin.CENTER,
        pixelOffset: new Cesium.Cartesian2(-6, 0)
      }
    });
  }

  const lonCount=5;
  for(let i=0; i<=lonCount; i++){
    const lon=GRID_WEST+(GRID_EAST-GRID_WEST)*i/lonCount;
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(lon, GRID_SOUTH-0.002, FLOOR_GRID_HEIGHT),
      label: {
        ...labelStyle,
        text: lon.toFixed(3)+'°',
        horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
        verticalOrigin: Cesium.VerticalOrigin.TOP,
        pixelOffset: new Cesium.Cartesian2(0, 6)
      }
    });
  }

  const latCount=5;
  for(let j=0; j<=latCount; j++){
    const lat=GRID_SOUTH+(GRID_NORTH-GRID_SOUTH)*j/latCount;
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(GRID_EAST+0.002, lat, FLOOR_GRID_HEIGHT),
      label: {
        ...labelStyle,
        text: lat.toFixed(3)+'°',
        horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
        verticalOrigin: Cesium.VerticalOrigin.CENTER,
        pixelOffset: new Cesium.Cartesian2(6, 0)
      }
    });
  }
}

let viewer;
(async()=>{
  setLoading(true);
  try{
    viewer=new Cesium.Viewer('app',{
      timeline:false, animation:false, homeButton:false, sceneModePicker:false,
      navigationHelpButton:false, baseLayerPicker:false, geocoder:false, infoBox:false,
      selectionIndicator:false, fullscreenButton:false, vrButton:false,
      shouldAnimate:true, shadows:false, terrainProvider:undefined, baseLayer:false,
      contextOptions: { 
        webgl: { antialias: true, alpha: false, depth: true, stencil: true, powerPreference: 'high-performance' } 
      }
    });

    viewer.resolutionScale = 1.0;
    viewer.useBrowserRecommendedResolution = true;

    addArcGISLayer(viewer);

    const scene=viewer.scene;
    scene.backgroundColor = COLOR_BG;
    scene.skyAtmosphere.show=false;
    scene.sun.show=false;
    scene.moon.show=false;
    scene.skyBox.show=false;
    scene.fog.enabled=false;
    scene.globe.enableLighting=false;
    scene.globe.baseColor = COLOR_BG;
    
    // ★ 保持默认深度测试，不要关闭！
    scene.globe.depthTestAgainstTerrain = true;
    
    // 允许相机进入地下，防止裁剪失效
    scene.screenSpaceCameraController.enableCollisionDetection = false;

    scene.postProcessStages.bloom.enabled = false;
    if (scene.postProcessStages.fxaa) {
      scene.postProcessStages.fxaa.enabled = false;
    }

    // ★ 先添加地面遮罩，再添加板子
    addGroundMask(viewer);

    const geojson={
      type:"FeatureCollection",
      features:[{type:"Feature",geometry:{type:"Polygon",coordinates:[[
        [BOUNDS.east,BOUNDS.south],[BOUNDS.west,BOUNDS.south],
        [BOUNDS.west,BOUNDS.north],[BOUNDS.east,BOUNDS.north],
        [BOUNDS.east,BOUNDS.south]
      ]]}}]
    };

    const ds=await Cesium.GeoJsonDataSource.load(geojson);
    const entities=ds.entities.values;
    const clipPolygons=[];
    let allPositions=[];

    entities.forEach(e=>{
      if(e.polygon){
        const h=e.polygon.hierarchy.getValue();
        if(h&&h.positions&&h.positions.length>0){
          clipPolygons.push(new Cesium.ClippingPolygon({positions:h.positions}));
          addBoardEffects(h.positions);
          allPositions=allPositions.concat(h.positions);
        }
      }
    });

    if(clipPolygons.length===0) throw new Error('无有效裁剪区域');

    // Clipping Polygons 作为双重保险
    scene.globe.clippingPolygons=new Cesium.ClippingPolygonCollection({
      polygons:clipPolygons, 
      enabled:true, 
      inverse:true,
      edgeColor: COLOR_BG,
      edgeWidth: 3.0
    });

    createGridAndLabels();

    const bs=Cesium.BoundingSphere.fromPoints(allPositions);
    viewer.camera.flyToBoundingSphere(bs,{
      offset:{
        heading:Cesium.Math.toRadians(-30),
        pitch:Cesium.Math.toRadians(-35),
        range: bs.radius * 2.8
      },
      duration:1.5
    });

  }catch(err){
    console.error(err);
    document.querySelector('.loading-text').textContent='❌ '+err.message;
    document.querySelector('.loading-spinner').style.display='none';
  }finally{
    setTimeout(()=>setLoading(false),800);
  }
})();
</script>
