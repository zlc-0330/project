<!DOCTYPE html>
<html>

<head>
    <script src="../config.js"></script>
    <meta charset="UTF-8" />
       <!-- 1. 引入 Cesium 样式（CDN） -->
    <link rel="stylesheet" href="https://unpkg.com/cesium@1.98/Build/Cesium/Widgets/widgets.css">
    <!-- 2. 引入 Cesium 核心 JS（CDN） -->
    <script src="https://unpkg.com/cesium@1.98/Build/Cesium/Cesium.js"></script>
    <script src="https://unpkg.com/shapefile@0.6.6/dist/shapefile.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        const viewer = new Cesium.Viewer('map', {
            imageryProvider: false,
            baseLayerPicker: false,
        });

        var xyz = new Cesium.UrlTemplateImageryProvider({
            "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
        })
        viewer.imageryLayers.addImageryProvider(xyz)
        viewer.scene.debugShowFramesPerSecond = true;

        var geojson = {
            "type": "FeatureCollection",
            "features": []
        };

        shapefile.open(`${config.data}shp2/唐家泊果园.shp`)
            .then(function (source) {
                source.read().then(function (result) {
                    geojson.features.push(result.value)
                    var promise = Cesium.GeoJsonDataSource.load(geojson, {
                        clampToGround: true,   //贴地
                        fill: Cesium.Color.PINK.withAlpha(0.6),
                    });
                    promise.then(function (dataSource) {
                        viewer.dataSources.add(dataSource);
                    });
                    viewer.flyTo(promise);

                });
            })  
    </script>
</body>

</html>
