<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <!-- 1. 引入 Cesium 样式（CDN） -->
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.98/Build/Cesium/Widgets/widgets.css">
  <!-- 2. 引入 Cesium 核心 JS（CDN） -->
  <script src="https://unpkg.com/cesium@1.98/Build/Cesium/Cesium.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>

  <!-- ./video.mp4 -->
  <script type="text/javascript">

    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjOWM5N2FlYy0wNTIyLTRhZDAtYTM2Yi04ZGEzYzMzNTRjYmQiLCJpZCI6NTcwNzEsImlhdCI6MTYyMjAxMjY3MH0.IRCEryIGGPZeCGqJ8lpMESuZO9DTIlLnF-WS-w9YYzc'
    const viewer = new Cesium.Viewer('map', {
      imageryProvider: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      baseLayerPicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: false,
      creditContainer: document.createElement("div"),
      orderIndependentTranslucency: false,

      //这个要有
      contextOptions: {
        webgl: {
          alpha: true,
        }
      },
    });
    var xyz = new Cesium.UrlTemplateImageryProvider({
      "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
    })
    viewer.imageryLayers.addImageryProvider(xyz)
    viewer.scene.debugShowFramesPerSecond = true;
    viewer.scene.globe.depthTestAgainstTerrain = true;


    viewer.scene.canvas.style.backgroundImage = "url('/assets/image/backGroundImg.jpg')" //设置背景图片
    viewer.scene.skyBox.show = false; //不显示天空盒
    viewer.scene.backgroundColor = new Cesium.Color(0.0, 0.0, 0.0, 0.0); //设置背景色透明


  </script>
</body>

</html>
