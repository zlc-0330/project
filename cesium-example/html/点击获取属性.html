<!DOCTYPE html>
<html>

<head>
    <script src="../config.js"></script>
    <meta charset="UTF-8" />
    <!-- 1. 引入 Cesium 样式（CDN） -->
    <link rel="stylesheet" href="https://unpkg.com/cesium@1.98/Build/Cesium/Widgets/widgets.css">
    <!-- 2. 引入 Cesium 核心 JS（CDN） -->
    <script src="https://unpkg.com/cesium@1.98/Build/Cesium/Cesium.js"></script>
</head>

<body style="
      margin: 0;
      overflow: hidden;
      background: #fff;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
    ">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>

    <script type="text/javascript">
        const viewer = new Cesium.Viewer('map', {
            imageryProvider: false,
            baseLayerPicker: false,
        });

        var xyz = new Cesium.UrlTemplateImageryProvider({
            "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
        })
        viewer.imageryLayers.addImageryProvider(xyz)
        viewer.scene.debugShowFramesPerSecond = true;
        viewer.scene.globe.depthTestAgainstTerrain = true;

        const tileset = new Cesium.Cesium3DTileset({
            url: `${config.data}buildings/tileset.json`,
        });

        tileset.readyPromise
            .then(function (tileset) {
                viewer.scene.primitives.add(tileset);
                viewer.zoomTo(tileset)
            })
            .catch(function (error) {
                console.log(error);
            });

        var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (movement) {

            // --------------------------获取被点击的属性----------------------
            var pickedFeature = viewer.scene.pick(movement.position);
            if (Cesium.defined(pickedFeature)) {
                console.log(pickedFeature);
                console.log(pickedFeature.getProperty("name"));
            }

        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    </script>
</body>

</html>
