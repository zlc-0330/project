<!DOCTYPE html>
<html>

<head>
  <script src="../config.js"></script>
  <meta charset="UTF-8" />
  <!-- 1. 引入 Cesium 样式（CDN） -->
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.98/Build/Cesium/Widgets/widgets.css">
  <!-- 2. 引入 Cesium 核心 JS（CDN） -->
  <script src="https://unpkg.com/cesium@1.98/Build/Cesium/Cesium.js"></script>
  <script>document.write('<script src="' + config.utils + 'excavateTerrain.js"><\/script>');</script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>

  <script type="text/javascript">

    const viewer = new Cesium.Viewer('map', {
      imageryProvider: false,
      baseLayerPicker: false,
    });

    var xyz = new Cesium.UrlTemplateImageryProvider({
      "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
    })
    viewer.imageryLayers.addImageryProvider(xyz)
    // 开启帧率
    viewer.scene.debugShowFramesPerSecond = true;

    // 加载默认地形
    viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
      url: '//data.mars3d.cn/terrain'
    });


    // 深度监测
    viewer.scene.globe.depthTestAgainstTerrain = true;

    viewer.camera.setView({
      destination: new Cesium.Cartesian3(-2409728.6420393116, 4694838.793290997, 3570221.295666795)
    });

    var mr = [{
      x: -2409728.6420393116,
      y: 4694838.793290997,
      z: 3570221.295666795
    },
    {
      x: -2409788.2788523836,
      y: 4694808.716559992,
      z: 3570220.598452356
    },
    {
      x: -2409813.389689466,
      y: 4694859.279606352,
      z: 3570137.7191554685
    },
    {
      x: -2409755.7791936737,
      y: 4694886.737790491,
      z: 3570140.4776008143
    }
    ];

    new excavateTerrain(viewer, {
      positions: mr,
      height: 30,
      bottom: `${config.assets}ter_analysis/excavationregion_side.jpg`,
      side: `${config.assets}ter_analysis/excavationregion_top.jpg`,
    })

  </script>
</body>

</html>
