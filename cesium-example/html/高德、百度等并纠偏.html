<!DOCTYPE html>
<html>

<head>
    <script src="../config.js"></script>
    <meta charset="UTF-8" />
    <!-- 1. 引入 Cesium 样式（CDN） -->
    <link rel="stylesheet" href="https://unpkg.com/cesium@1.98/Build/Cesium/Widgets/widgets.css">
    <!-- 2. 引入 Cesium 核心 JS（CDN） -->
    <script src="https://unpkg.com/cesium@1.98/Build/Cesium/Cesium.js"></script>
    <script>document.write('<script src="' + config.utils + 'cesium.map.min.js"><\/script>');</script>
</head>

<body style="
      margin: 0;
      overflow: hidden;
      background: #fff;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
    ">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">
        const viewer = new Cesium.Viewer("map", {
                        imageryProvider: false,
            baseLayerPicker: false,
        });

        // 清除默认底图 
        //viewer.imageryLayers.remove(viewer.imageryLayers.get(0));

        // 用法
        // https://github.com/jiawanlong/cesium-map
        var options = {
            style: "elec", // style: img、elec、cva
            crs: "WGS84", // 使用84坐标系，默认为：GCJ02
        };
        viewer.imageryLayers.add(
            new Cesium.ImageryLayer(new Cesium.AMapImageryProvider(options))
        );
    </script>
</body>

</html>
