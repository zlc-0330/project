<!DOCTYPE html>
<html>

<head>
  <script src="../config.js"></script>
  <meta charset="UTF-8" />
  <!-- 1. 引入 Cesium 样式（CDN） -->
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.98/Build/Cesium/Widgets/widgets.css">
  <!-- 2. 引入 Cesium 核心 JS（CDN） -->
  <script src="https://unpkg.com/cesium@1.98/Build/Cesium/Cesium.js"></script>
  <script>document.write('<script src="' + config.utils + 'skyBoxOnGround.js"><\/script>');</script>
  <script>document.write('<script src="' + config.utils + 'SkyBox.js"><\/script>');</script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
  <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>

  <!-- ./video.mp4 -->
  <script type="text/javascript">

    const viewer = new Cesium.Viewer('map', {
      imageryProvider: false,
      baseLayerPicker: false,
      contextOptions: {
        // requestWebgl1: true,
      },
    });
    var xyz = new Cesium.UrlTemplateImageryProvider({
      "url": '//data.mars3d.cn/tile/img/{z}/{x}/{y}.jpg'
    })
    viewer.imageryLayers.addImageryProvider(xyz)
    viewer.scene.debugShowFramesPerSecond = true;
    viewer.scene.globe.depthTestAgainstTerrain = true;

    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(-95.166493, 39.9060534, 20000000)
    });


    //设置天空盒
    var skyBox = new SkyBox(viewer);
    //天空盒
    skyBox.customSkyBox({
      positiveX: `${config.assets}SkyBox/tycho2t3_80_px.jpg`,
      negativeX: `${config.assets}SkyBox/tycho2t3_80_mx.jpg`,
      positiveY: `${config.assets}SkyBox/tycho2t3_80_py.jpg`,
      negativeY: `${config.assets}SkyBox/tycho2t3_80_my.jpg`,
      positiveZ: `${config.assets}SkyBox/tycho2t3_80_pz.jpg`,
      negativeZ: `${config.assets}SkyBox/tycho2t3_80_mz.jpg`
    });


    // //近地天空盒
    // skyBox.SkyBoxOnGround({
    //     sources: {
    //         positiveX: './SkyBox/Right.jpg',
    //         negativeX: './SkyBox/Left.jpg',
    //         positiveY: './SkyBox/Front.jpg',
    //         negativeY: './SkyBox/Back.jpg',
    //         positiveZ: './SkyBox/Up.jpg',
    //         negativeZ: './SkyBox/Down.jpg'
    //     }
    // });
  </script>
</body>

</html>
